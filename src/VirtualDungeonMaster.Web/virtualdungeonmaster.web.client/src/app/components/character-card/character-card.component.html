<div class="character-card"
     [class.selectable]="selectable"
     (click)="onSelect()">

  <div class="character-header">
    <h3 class="character-name" *ngIf="!showActions">{{ character.name }}</h3>
    <h4 class="character-name" *ngIf="showActions">{{ character.name }}</h4>

    <div class="character-actions" *ngIf="showActions">
      <button
        class="btn-icon-small edit"
        (click)="onEdit(); $event.stopPropagation()"
        [disabled]="loading"
        title="Edit character">
        ✏️
      </button>
      <button
        class="btn-icon-small delete"
        (click)="onDelete(); $event.stopPropagation()"
        [disabled]="loading"
        title="Delete character">
        🗑️
      </button>
    </div>
  </div>

  <div class="character-details">
    <div class="detail-row">
      <span class="detail-label">Class:</span>
      <span class="detail-value">
        <span class="detail-icon">{{ getClassInfo().icon }}</span>
        {{ getClassInfo().name }}
      </span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Race:</span>
      <span class="detail-value">
        <span class="detail-icon">{{ getRaceInfo().icon }}</span>
        {{ getRaceInfo().name }}
      </span>
    </div>

    <div *ngIf="character.background && showBackground" class="character-background">
      <span class="detail-label">Background:</span>
      <p class="background-text">{{ character.background }}</p>
    </div>
  </div>

  <div class="character-id" *ngIf="showActions">#{{ character.id }}</div>
</div>
